name: task_manager_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # Date & formatting
  intl: ^0.19.0

  # Notifications
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^0.3.0

  # App icon & splash
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

# ---------------- SPLASH SCREEN ----------------
flutter_native_splash:
  color: "#0B0B0D"
  image: assets/logo/app_icon.png
  android: true
  ios: true
  web: true
  android_gravity: center
  ios_content_mode: center

# ---------------- APP ICON ----------------
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/logo/app_icon.png
  adaptive_icon_background: "#0B0B0D"
  adaptive_icon_foreground: assets/logo/app_icon.png

# ---------------- FLUTTER ----------------
flutter:
  uses-material-design: true
  assets:
    - assets/login_bg.jpg
    - assets/logo/app_icon.png


